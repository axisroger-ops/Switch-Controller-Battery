name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up MSYS2 MinGW-w64
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: mingw-w64-x86_64-gcc

      - name: Set up Inno Setup
        shell: powershell
        run: |
          choco install innosetup --no-progress -y
          echo "C:\Program Files (x86)\Inno Setup 6" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build C++ Binaries
        shell: msys2 {0}
        run: |
          g++ -shared -O2 -Os -s -fno-exceptions -fno-rtti SwitchControllerBatteryHook.cpp -o SwitchControllerBatteryHook.dll -lkernel32 -luser32
          g++ -O2 -Os -s -fno-exceptions -fno-rtti -mwindows -municode SwitchControllerBattery.cpp -o SwitchControllerBattery.exe -lsetupapi -lhid -lcfgmgr32 -lkernel32 -luser32 -ldwmapi -lcomctl32

      - name: Build Inno Setup Installer (.exe)
        shell: powershell
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" ".\installer.iss"

      - name: Package Portable ZIP
        shell: powershell
        run: |
          $ver = if ($env:GITHUB_REF_NAME) { $env:GITHUB_REF_NAME } else { "v1.0.0" }
          $zipName = "SwitchControllerBattery-$ver.zip"
          $files = @(
            "SwitchControllerBattery.exe",
            "SwitchControllerBatteryHook.dll",
            "install.ps1",
            "uninstall.ps1",
            "build.ps1",
            "app.ico",
            "LICENSE",
            "README.md"
          )
          Compress-Archive -Path $files -DestinationPath $zipName -Force

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            SwitchControllerBattery-Setup-*.exe
            SwitchControllerBattery-*.zip
          draft: false
          prerelease: false
          generate_release_notes: true

