name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up MinGW & Inno Setup
        shell: powershell
        run: |
          echo "C:\msys64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          choco install innosetup --no-progress -y
          echo "C:\Program Files (x86)\Inno Setup 6" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build C++ Binaries
        shell: powershell
        run: |
          & ".\build.ps1"

      - name: Build Inno Setup Installer (.exe)
        shell: powershell
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" ".\installer.iss"

      - name: Package Portable ZIP
        shell: powershell
        run: |
          $ver = if ($env:GITHUB_REF_NAME) { $env:GITHUB_REF_NAME } else { "v1.0.0" }
          $zipName = "SwitchControllerBattery-$ver.zip"
          $files = @(
            "SwitchControllerBattery.exe",
            "SwitchControllerBatteryHook.dll",
            "install.ps1",
            "uninstall.ps1",
            "build.ps1",
            "app.ico",
            "LICENSE",
            "README.md"
          )
          Compress-Archive -Path $files -DestinationPath $zipName -Force

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            SwitchControllerBattery-Setup-*.exe
            SwitchControllerBattery-*.zip
          draft: false
          prerelease: false
          generate_release_notes: true

